<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Discern</title>
  <link rel="icon" href="{{ asset_url('discern.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ asset_url('app.css') }}">
  <script src="{{ asset_url('app.js') }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="shell" data-ui>
    <header class="topbar">
      <div class="bar-inner">
        <a class="brand" href="/" aria-label="Discern home"><span class="brand-mark" aria-hidden="true"></span>Discern</a>
        <span class="workspace-name">Bedaquiline research</span>
        <span class="local-state">Offline workspace</span>
      </div>
    </header>
    {% include "navigation.html" %}
    <main class="sheet" id="content">
      <div class="notice-bar"><p class="research-notice">{{ banner }}</p></div>
      <div class="page">{% block content %}{% endblock %}</div>
    </main>
  </div>
</body>
</html>
