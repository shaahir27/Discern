[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discern"
version = "0.1.0"
description = "Offline research explorer for archived bedaquiline evaluations"
requires-python = ">=3.12"

[project.scripts]
discern = "discern.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
discern = ["ui/templates/*.html", "ui/static/*.css", "ui/static/*.js", "ui/static/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
cache_dir = ".pytest_cache_local"
filterwarnings = [
    "ignore:.*The inplace keyword in DataFrame.drop is deprecated.*",
    "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*",
    "ignore::DeprecationWarning",
]
